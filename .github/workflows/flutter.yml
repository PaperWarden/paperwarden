name: Flutter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified Flutter SDK
        run: .github/scripts/setup_flutter.sh
        working-directory: ${{ github.workspace }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
