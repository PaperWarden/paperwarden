name: Android

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "core/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "core/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Cargokit builds the Rust bridge for every Android ABI the APK ships.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: "1.98.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Install verified Flutter SDK
        run: .github/scripts/setup_flutter.sh
        working-directory: ${{ github.workspace }}
      - run: flutter pub get
      - name: Verify production manifest has no Internet permission
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'Production INTERNET permission is forbidden.' >&2
            exit 1
          fi
      - run: flutter build apk --debug
      # Cargokit skips a missing library without failing the build, so check
      # the APK really carries the Rust core for each ABI.
      - name: APK contains the Rust bridge
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! unzip -l "$apk" | grep -q "lib/$abi/libpaperwarden_bridge.so"; then
              echo "libpaperwarden_bridge.so missing for $abi" >&2
              exit 1
            fi
          done
      - name: Android lint
        run: ./android/gradlew -p android lintDebug
