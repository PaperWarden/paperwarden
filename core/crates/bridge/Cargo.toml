[package]
# Must equal the [lib] name: Cargokit looks for lib<package-name>.so and
# silently ships nothing if they differ.
name = "paperwarden_bridge"
version = "0.0.1"
description = "The generated Flutter-to-Rust contract for the PaperWarden core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "paperwarden_bridge"
# cdylib for Android, staticlib for iOS, lib for Rust tests.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Only what the generated code needs. `rust-async` is required by opaque types
# (`CancelHandle`); `anyhow` by Dart callbacks (`render_pdf`'s engine, #59),
# whose exceptions arrive as `anyhow::Error`. Logging, backtrace and
# wasm-start stay off.
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = ["anyhow", "dart-opaque", "rust-async", "thread-pool"] }
paperwarden-core = { path = "../.." }
paperwarden-pdf-scan = { path = "../pdf-scan" }
# PDFium itself is loaded only in the Android render service (#59).
paperwarden-pdf = { path = "../pdf" }
# Waits for the Dart callback that runs the render service.
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }

# The bridge cannot inherit the workspace's `unsafe_code = "forbid"`: the
# generated FFI glue is unsafe by nature. Hand-written code here keeps the same
# policy, with `unsafe_code` at `deny` so only the generated module (see
# src/lib.rs) may allow it. Keep the clippy list in sync with core/Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
print_stderr = "deny"
print_stdout = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
