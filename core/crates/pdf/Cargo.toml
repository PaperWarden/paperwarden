[package]
name = "paperwarden-pdf"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "PDF rendering and text extraction through PDFium (feasibility, PW-010)"

[lints]
workspace = true

[dependencies]
paperwarden-core = { path = "../.." }
paperwarden-pdf-scan = { path = "../pdf-scan" }
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_8125", "thread_safe"] }

# Peak memory for the probe on Apple platforms, which have no /proc
# (getrusage through a safe wrapper; the workspace forbids unsafe code).
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
nix = { version = "0.32", default-features = false, features = ["resource"] }
