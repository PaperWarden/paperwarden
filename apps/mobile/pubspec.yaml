name: paperwarden
description: Offline-first document viewer, converter, scanner, OCR and privacy toolbox.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_rust_bridge: 2.13.0
  paperwarden_bridge:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/legal/PRIVACY.md

