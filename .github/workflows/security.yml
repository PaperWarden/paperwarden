name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: core}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: taiki-e/install-action@fdd9c53beefd63405d1a23c7d3510edb29c26e15 # cargo-audit
      - run: cargo audit

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: core/Cargo.toml
          command: check
          arguments: --all-features
          log-level: warn
