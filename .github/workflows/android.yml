name: Android

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/check_invariants.py"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "scripts/check_invariants.py"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install verified Flutter SDK
        run: .github/scripts/setup_flutter.sh
        working-directory: ${{ github.workspace }}
      - run: flutter pub get
      - name: Verify production manifest has no Internet permission
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'Production INTERNET permission is forbidden.' >&2
            exit 1
          fi
      - run: flutter build apk --debug
      # Plugins from the pub cache can add permissions that no file in this
      # repository shows. Check the manifest Gradle merges for release. Runs after
      # the build, which generates the Gradle wrapper.
      - name: Merged release manifest requests no forbidden permission
        env:
          MERGED: build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
        run: |
          ./android/gradlew -p android :app:processReleaseMainManifest
          python3 ../../scripts/check_invariants.py --android-merged-manifest "$MERGED"
      - name: Android lint
        run: ./android/gradlew -p android lintDebug
