name: Bounded fuzzing

# Each target runs for a fixed time with memory and per-input limits, starting
# from the committed seeds in fuzz/seeds. Pull requests that touch the core
# get a short run; the weekly run is longer. A crash fails the job and uploads
# the crashing input. docs/ci/fuzzing.md says what each target covers.

on:
  pull_request:
    paths:
      - "core/src/**"
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [job_id, archive_entry_path, magic_bytes, job_pipeline]
    # cargo-fuzz needs a Cargo project in the working directory; the fuzz
    # crate lives outside the core workspace, so point at it explicitly.
    defaults:
      run: {working-directory: core}
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '60' || '600' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with: {toolchain: "nightly-2026-08-26"}
      # Built from crates.io sources with its lockfile.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        run: |
          mkdir -p "../fuzz/corpus/$TARGET"
          cargo fuzz run --fuzz-dir ../fuzz "$TARGET" \
            "../fuzz/corpus/$TARGET" "../fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_TO_RUN" -max_len=8192 -timeout=10 -rss_limit_mb=2048
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
