[package]
name = "paperwarden-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
paperwarden-core = { path = "../core" }
paperwarden-store = { path = "../core/crates/store" }
paperwarden-pdf-scan = { path = "../core/crates/pdf-scan" }

[[bin]]
name = "job_id"
path = "fuzz_targets/job_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_entry_path"
path = "fuzz_targets/archive_entry_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "magic_bytes"
path = "fuzz_targets/magic_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "job_pipeline"
path = "fuzz_targets/job_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_search"
path = "fuzz_targets/store_search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_scan"
path = "fuzz_targets/pdf_scan.rs"
