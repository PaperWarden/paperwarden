[package]
name = "paperwarden-qpdf"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "PDF structural transforms and encryption through qpdf (feasibility, PW-012)"
build = "build.rs"
links = "pw_qpdf"

[dependencies]
paperwarden-core = { path = "../.." }
paperwarden-pdf-scan = { path = "../pdf-scan" }

[build-dependencies]
cc = "1.11.3"

# The crate cannot inherit the workspace's `unsafe_code = "forbid"`: qpdf's C
# API needs it. Hand-written code keeps the same policy, with `unsafe_code` at
# `deny` so only src/ffi.rs may allow it (as in the bridge). Keep the clippy
# list in sync with core/Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(paperwarden_qpdf)"] }

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
print_stderr = "deny"
print_stdout = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
