name: Feature proposal
description: Propose an in-scope product capability.
title: "feat: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: outcome
    attributes: {label: User outcome}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Scope and acceptance criteria}
    validations: {required: true}
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: This requires no backend, account, telemetry, cloud API, or mandatory Internet.
          required: true
        - label: This is not full Office editing for 1.0.
          required: true

