name: Android

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install verified Flutter SDK
        run: .github/scripts/setup_flutter.sh
        working-directory: ${{ github.workspace }}
      - run: flutter pub get
      - name: Verify production manifest has no Internet permission
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo 'Production INTERNET permission is forbidden.' >&2
            exit 1
          fi
      - run: flutter build apk --debug
      - name: Android lint
        run: ./android/gradlew -p android lintDebug
