name: Product invariants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - run: python scripts/check_invariants.py
