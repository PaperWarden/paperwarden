name: Flutter

on:
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/flutter.yml"]
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/flutter.yml"]

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/mobile}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
