name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: core}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@fdd9c53beefd63405d1a23c7d3510edb29c26e15 # cargo-audit
      - run: cargo audit

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          manifest-path: core/Cargo.toml
          command: check
          arguments: --all-features
          log-level: warn
